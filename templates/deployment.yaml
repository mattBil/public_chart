apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Values.container_name }}
          image: {{ .Values.image }}
          resources:
            requests:
                memory: {{ .Values.resource.requests.memory }}
                cpu: {{ .Values.resource.requests.cpu }}
            limits:
                memory: {{ .Values.resource.limits.memory }}
                cpu: {{ .Values.resource.limits.cpu }}