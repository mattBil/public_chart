apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# resources:
#   - ./base/helm-chart

helmGlobals:
  chartHome: . # ./base/helm-chart

helmCharts:
- name: helm-chart
  # repo: 
  version: 1.1.25
  releaseName: cop
  namespace: helm-vs-kust
  valuesFile: helm-chart/my-values.yaml

commonAnnotations:
  owner: "admin@company.com"

images:
  - name: nginx
    newName: nginx
    newTag: "trixie-perl"

replicas:
  - name: cop
    count: 10

patchesStrategicMerge:
  - path: overlay/dev/patches.yaml

